name = "mangoi-ai-avatar-cf"
main = "src/index.js"
compatibility_date = "2025-05-01"

# 정적 자산(public/) + Worker(API) 함께 배포.
# 정적 파일이 먼저 서빙되고, /api/chat 같은 비-자산 경로만 Worker 가 처리합니다.
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare Workers AI (외부 키 불필요)
[ai]
binding = "AI"

# 🔁 음성 캐시(R2) — 같은 문장은 한 번만 Azure 로 만들고 이후엔 공짜로 재생(mangoi.ai 와 같은 방식).
#    ⚠️ 첫 배포 전에 버킷을 한 번 만들어야 합니다: 12_r2_cache.bat 더블클릭
#       (또는 npx wrangler r2 bucket create mangoi-avatar-tts-cache)
[[r2_buckets]]
binding = "TTS_CACHE"
bucket_name = "mangoi-avatar-tts-cache"

# 환경변수(시크릿)는 코드/깃허브에 적지 않습니다.
# 챗/STT 는 위 Workers AI(AI 바인딩)로 동작하며 별도 키가 필요 없습니다.
# 음성(TTS)은 Azure Speech 만 씁니다(키가 없으면 브라우저 음성으로 자동 폴백):
#   AZURE_SPEECH_KEY + AZURE_SPEECH_REGION (예: koreacentral)  → 11_azure_key.bat
#   (선택) 목소리: AZURE_VOICE_KO(학생, 기본 ko-KR-SunHiNeural) / AZURE_VOICE_KO_OPS(운영비서)
#                  / AZURE_VOICE_EN(영어, 기본 en-US-JennyNeural)
# ⛔ Typecast 는 쓰지 않습니다 — 100만 자당 $70~90 로 Azure($15)의 5배 이상.
# 로컬 키: .dev.vars 파일 (git 에 안 올라감)
